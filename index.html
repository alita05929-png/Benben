    <script>
        // 图片数组
        const images = [

        var DORA_CONTRACT = "0x23fe903be385832fd7bb82bf1fee93f696278888";

        // 翻页动画函数
        function flipPage(newIndex) {
            // 添加翻出动画
            bookImage.classList.add('flip-out');
            // 等待翻出动画完成后切换图片并翻入
            setTimeout(() => {
                bookImage.src = images[newIndex];
                bookImage.classList.remove('flip-out');
                bookImage.classList.add('flip-in');
                // 移除翻入类，准备下次动画
                setTimeout(() => {
                    bookImage.classList.remove('flip-in');
                }, 600);
            }, 300);
        }
        // 上一页按钮点击事件
        prevBtn.addEventListener('click', function () {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            flipPage(currentIndex);
        });
        // 下一页按钮点击事件
        nextBtn.addEventListener('click', function () {
            currentIndex = (currentIndex + 1) % images.length;
            flipPage(currentIndex);
        });
        // big_wen 图片数组 (1-9)
        const bigWenImages = [
            'image/big_wen01.png',
            './image/big_wen02.png',
            './image/big_wen03.png',
            './image/big_wen04.png',
            './image/big_wen05.png',
            './image/big_wen06.png',
            './image/big_wen07.png',
            './image/big_wen08.png',
            './image/big_wen09.png'
        ];
        let bigWenCurrentIndex = 0;
        const bigWenImage = document.querySelector('.wen_img img');
        const bigWenPrevBtn = document.querySelector('.wen_page .prev');
        const bigWenNextBtn = document.querySelector('.wen_page .next');
        // big_wen 翻页动画函数
        function flipBigWenPage(newIndex) {
            // 添加翻出动画
            bigWenImage.classList.add('flip-out');
            // 等待翻出动画完成后切换图片并翻入

                bigWenImage.classList.remove('flip-out');
                bigWenImage.classList.add('flip-in');

        // big_wen 上一页按钮点击事件

            bigWenCurrentIndex = (bigWenCurrentIndex - 1 + bigWenImages.length) % bigWenImages.length;

        // big_wen 下一页按钮点击事件
        bigWenNextBtn.addEventListener('click', function () {
            bigWenCurrentIndex = (bigWenCurrentIndex + 1) % bigWenImages.length;

        // index04.jpg 图片点击事件

        const staticProvider = new ethers.providers.StaticJsonRpcProvider(

        // 捐赠弹窗功能
        function showDonationModal() {
            // 创建模态框背景
            const modalOverlay = document.createElement('div');
            modalOverlay.id = 'donationModalOverlay';
            modalOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 10000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
                box-sizing: border-box;
            `;
            // 创建模态框内容
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: linear-gradient(135deg, #2c1810, #4a2c1a);
                border: 3px solid #000000;
                border-radius: 12px;
                padding: 30px;
                max-width: 400px;
                width: 100%;
                box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.6);
                position: relative;
            `;
            modal.innerHTML = `
                <div style="text-align: center; margin-bottom: 25px;">
                    <h2 style="margin: 0; color: #ffffff; font-size: 24px; font-weight: bold; text-shadow: 0px 4px 0px #000000; -webkit-text-stroke: 1px #000000;">Donation Support</h2>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: #ffffff; font-weight: bold; text-shadow: 0px 2px 0px #000000;">Donation Address:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="text" id="donationAddress" value="0x38694E5a9CfcB98e78802CB42dB5471B094313E9" readonly 
                            style="flex: 1; padding: 12px; border: 2px solid #000000; border-radius: 6px; background: #1f120d; font-size: 14px; color: #ffffff; box-shadow: 2px 4px 0px #000000;">
                    </div>
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; color: #ffffff; font-weight: bold; text-shadow: 0px 2px 0px #000000;">Donation Amount (DORA):</label>
                    <input type="number" id="donationAmount" placeholder="Enter donation amount" min="0" step="0.01"
                        style="width: 100%; padding: 12px; border: 2px solid #000000; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: #1f120d; color: #ffffff; box-shadow: 2px 4px 0px #000000;">
                </div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button id="confirmDonation" style="padding: 12px 30px; background: #f0b90b; color: #000000; border: 2px solid #000000; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 4px 6px 0px #000000; text-shadow: 0px 2px 0px #ffffff;">Confirm Donation</button>
                    <button id="cancelDonation" style="padding: 12px 30px; background: #555b77; color: #ffffff; border: 2px solid #000000; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 4px 6px 0px #000000; text-shadow: 0px 2px 0px #000000;">Cancel</button>
                </div>
            `;
            modalOverlay.appendChild(modal);
            document.body.appendChild(modalOverlay);
            // 绑定事件
            var isRun = false;
            document.getElementById('confirmDonation').addEventListener('click', async function () {
                if (isRun) return;
                isRun = true;
                const amount = document.getElementById('donationAmount').value;
                if (!amount && parseFloat(amount) <= 0) {
                    showMsg('Please enter a valid donation amount!');
                    isRun = false;
                    return;
                }
                if (!globalSigner) {
                    showMsg('Please connect wallet first.');
                    isRun = false;
                    return;
                }
                try {
                    const ERC20_ABI = [
                        "function balanceOf(address owner) view returns (uint256)",
                        "function transfer(address to, uint256 value) returns (bool)"
                    ];
                    const tokenContract = new ethers.Contract(DORA_CONTRACT, ERC20_ABI, globalSigner);
                    const myAddr = await globalSigner.getAddress();
                    const amountToSend = ethers.utils.parseUnits(amount.toString(), 18);
                    const bnbBalance = await staticProvider.getBalance(myAddr);
                    const minGas = ethers.utils.parseEther("0.001");
                    if (bnbBalance.lt(minGas)) {
                        showMsg("Your BNB balance is insufficient to cover the transaction fee.");
                        return;
                    }
                    // DORA balance
                    const rawBalance = await tokenContract.balanceOf(myAddr);
                    console.log("DORA 余额：", rawBalance.toString());
                    if (rawBalance.lt(amountToSend)) {
                        showMsg("Your DORA balance is insufficient to make a donation.");
                        return;
                    }
                    // 2. send
                    console.log("Sending transaction...");
                    const tx = await tokenContract.transfer(DONATION_RECEIVER, amountToSend);
                    console.log("Transaction hash:", tx.hash);
                    if (tx && tx.hash) {
                        showMsg(`Thank you for your donation! Amount: ${amount} DORA`);
                    }
                    else {
                        showMsg('Transaction fail');
                    }
                    addDonate(tx.hash);
                    closeDonationModal();
                } catch (error) {
                    console.error('Donation failed:', error);
                    showMsg('Donation failed! Please try again.');
                } finally {
                    isRun = false;
                }
            });
            function closeDonationModal() {
                document.body.removeChild(modalOverlay);
            }
            document.getElementById('cancelDonation').addEventListener('click', function () {
                document.body.removeChild(modalOverlay);
            });
            // 点击背景关闭模态框
            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) {
                    document.body.removeChild(modalOverlay);
                }
            });
        }
        function copyCAToClipboard() {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(DORA_CONTRACT).then(function () {
                    showMsg('CA address copied successfully');
                }).catch(function (err) {
                    console.error('Failed to copy CA address: ', err);
                    fallbackCopyTextToClipboard(DORA_CONTRACT);
                });
            } else {
                fallbackCopyTextToClipboard(DORA_CONTRACT);
            }
        }
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showMsg('Copy successful');
                } else {
                    showMsg('Copy failed');
                }
            } catch (err) {
                showMsg('Copy failed');
                console.error('Failed to copy CA address (fallback): ', err);
            }
            document.body.removeChild(textArea);
        }
        async function handleWalletConnect() {
            console.log('Connecting wallet...');
            if (globalSigner) return;
            console.log('Start...');
            const providerOptions = {
                walletconnect: {
                    package: window.WalletConnectProvider.default,
                    options: {
                        rpc: { 56: "https://bsc-dataseed.binance.org/" }
                    }
                }
            };
            console.log('Start web3Modal...');
            const web3Modal = new window.Web3Modal.default({
                cacheProvider: false,
                providerOptions
            });
            try {
                console.log('Start provider...');
                const provider = await web3Modal.connect();
                // change BSC domain（chainId = 56）
                const currentChainId = await provider.request({ method: 'eth_chainId' });
                console.log('currentChainId=', currentChainId);
                if (currentChainId !== '0x38') {
                    try {
                        await provider.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x38' }]
                        });
                        console.log('✅ change BSC');
                    } catch (switchErr) {
                        console.warn('⚠️ change BSC fail', switchErr);
                        showMsg('please change to BSCPlease switch to the BSC network first.');
                        return;
                    }
                }
                console.log('Finish provider.request...');
                const ethersProvider = new ethers.providers.Web3Provider(provider);
                const signer = ethersProvider.getSigner();
                const walletAddress = await signer.getAddress();
                globalProvider = ethersProvider;
                globalSigner = signer;
                // remove listen
                if (provider.removeAllListeners) {
                    provider.removeAllListeners('accountsChanged');
                    provider.removeAllListeners('chainChanged');
                }
                // register listen
                provider.on('accountsChanged', accounts => {
                    console.log('new account:', accounts);
                });
                provider.on('chainChanged', chainId => {
                    console.log('network change:', chainId);
                });
                // 连接按钮点击控制
                const connectButton = document.querySelector('.CA .connect:not(.connect_ok)');
                const connectStatus = document.querySelector('.CA .connect_ok');
                if (connectButton && connectStatus) {
                    connectButton.style.display = 'none';
                    connectStatus.style.display = 'block';
                    const head = walletAddress.slice(0, 6);
                    const tail = walletAddress.slice(-4);
                    const result = head + '...' + tail;
                    connectStatus.innerHTML = result;
                }
                updateDonate(walletAddress);
                showMsg('Connection successful');
            } catch (error) {
                console.log('connect fail:', error);
                showMsg('Connection failed');
            } finally {
                connecting = false;
            }
        }
        async function updateTable() {
            fetch('https://api.dorausd1.com')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector('.table-clone tbody');
                    tbody.innerHTML = '';
                    data.forEach(item => {
                        const row = `<tr>
                             <td class="date">${item.time}</td>
                            <td class="add">${item.from}</td>
                            <td class="num">${item.value}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => console.error('Error fetching donations:', err));
        }
        updateTable();
        setInterval(updateTable, 60000);
        // show msg
        function showMsg(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.className = 'toast';
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease-out forwards';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 2000);
        }
        async function updateDonate(userAddress) {
            try {
                // 构造 URL，并添加 address 参数
                const url = new URL('/');
                url.searchParams.set('address', userAddress);
                // 发起 GET 请求
                const response = await fetch(url.toString(), {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                if (!response.ok) {
                    showMsg(`Network response was not ok (${response.status})`);
                    return;
                }
                const data = await response.json();
                // 渲染表格
                const donations = document.getElementById('donations');
                donations.innerHTML = data.total;
            } catch (err) {
                console.error('Error fetching donations:', err);
            }
        }
        async function addDonate(txHash) {
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: new URLSearchParams({
                        tx_hash: txHash
                    })
                });
                if (!response.ok) {
                    showMsg(`Network response was not ok (${response.status})`);
                    return;
                }
                const data = await response.json();
                // 渲染表格
                const donations = document.getElementById('donations');
                donations.innerHTML = data.total;
            } catch (err) {
                console.error('Error fetching donations:', err);
            }
        }
