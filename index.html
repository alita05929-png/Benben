<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="top">

            <img class="ca_num" src="image/CA.png" alt="犇犇 CA" onclick="copyCAToClipboard()" style="cursor: pointer;">
            <img class="connect" id="connectWalletBtn" src="image/connect.png" alt="Connect Wallet" style="cursor: pointer;">
            <div class="connect connect_ok" style="display: none;">
            </div>
        </div>
        <div class="womens"></div>
        <img class="bgg" src="image/index01.jpg" alt="犇犇 — Born to Charge. Built on BNB">
    </div>
    <div class="book_btn">
        <div class="book">
            <div class="book_con">
                <img src="image/wen-1.png" alt="About 犇犇">
            </div>
            <div class="book_change">
                <img class="prev" src="image/next.png" alt="prev">
                <img class="next" src="image/next.png" alt="next">
            </div>
        </div>
        <img class="bgg" src="image/index02.jpg" alt="About 犇犇">
    </div>
    <div class="url_btn">
        <img class="fake_bg" src="image/index03.jpg" alt="Join the Charge">
        <div class="link-panel">
            <a class="link-btn" href="https://dexscreener.com/bsc/0x2720d5573b4f20a62ce145772cf4e6992a7dc246" target="_blank" rel="noopener">DexScreener</a>
            <a class="link-btn" href="https://bscscan.com/token/0x2720d5573b4f20a62ce145772cf4e6992a7dc246" target="_blank" rel="noopener">BSCScan</a>
            <a class="link-btn" href="https://x.com/benbenbnb" target="_blank" rel="noopener">X / Twitter</a>
            <a class="link-btn" href="https://t.me/benbenonbnb" target="_blank" rel="noopener">Telegram</a>
        </div>
    </div>
    <div class="buy_dora big_wen">
        <img src="image/index05.jpg" alt="The Spirit of 犇犇">
        <div class="wen_con">
            <div class="wen_img">
                <img src="image/big_wen01.png" alt="犇犇 lore">
            </div>
        </div>
    </div>
    <div class="buy_dora">
        <img src="image/index06.jpg" alt="Community Charge">
        <div class="table-container">
            <div class="table-scroll">
                <table class="table table-clone">
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="bottom_text">—— My 犇犇 amount: <span id="donations">0</span> —— </div>
    </div>
    <div class="buy_dora">
        <img src="image/index07.jpg" alt="Watch 犇犇 Charge">
        <div class="video_con">
            <img class="play" src="image/play.png" alt="Play">
            <video src="video/IMG_5888.mp4" controls></video>
        </div>
    </div>
    <div class="foot">Copyright © 2026 犇犇 · Built on BNB · <a href="https://x.com/benbenbnb" target="_blank" rel="noopener">@benbenbnb</a></div>
    <script>
        const images = [
            'image/wen-1.png'
        ];
        var TOKEN_CONTRACT = "0x2720d5573b4f20a62ce145772cf4e6992a7dc246";
        var TOKEN_NAME = "犇犇";
        var TOKEN_TICKER = "犇犇";
        var DONATION_RECEIVER = "";
        var globalProvider = null;
        var globalSigner = null;
        let currentIndex = 0;
        const bookImage = document.querySelector('.book_con img');
        const prevBtn = document.querySelector('.prev');
        const nextBtn = document.querySelector('.next');
        document.addEventListener('DOMContentLoaded', function () {
            const connectBtn = document.getElementById('connectWalletBtn');
            if (connectBtn) {
                setTimeout(() => {
                    connectBtn.addEventListener('click', handleWalletConnect);
                }, 2000);
            }
            document.querySelectorAll('.hotspot').forEach(el => {
                el.style.cursor = 'pointer';
                el.style.pointerEvents = 'auto';
                el.addEventListener('click', () => {
                    const url = el.getAttribute('data-url');
                    if (url) {
                        window.open(url, '_blank');
                    }
                });
            });
        });
        function handleBuyClick() {
            if (!TOKEN_CONTRACT) {
                showMsg('CA coming soon');
                return;
            }
            window.open('https://pancakeswap.finance/swap?outputCurrency=' + TOKEN_CONTRACT, '_blank');
        }
        function flipPage(newIndex) {
            bookImage.classList.add('flip-out');
            setTimeout(() => {
                bookImage.src = images[newIndex];
                bookImage.classList.remove('flip-out');
                bookImage.classList.add('flip-in');
                setTimeout(() => {
                    bookImage.classList.remove('flip-in');
                }, 600);
            }, 300);
        }
        if (prevBtn) {
            prevBtn.addEventListener('click', function () {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                flipPage(currentIndex);
            });
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', function () {
                currentIndex = (currentIndex + 1) % images.length;
                flipPage(currentIndex);
            });
        }
        const bigWenImages = [
            'image/big_wen01.png'
        ];
        let bigWenCurrentIndex = 0;
        const bigWenImage = document.querySelector('.wen_img img');
        const bigWenPrevBtn = document.querySelector('.wen_page .prev');
        const bigWenNextBtn = document.querySelector('.wen_page .next');
        function flipBigWenPage(newIndex) {
            bigWenImage.classList.add('flip-out');
            setTimeout(() => {
                bigWenImage.src = bigWenImages[newIndex];
                bigWenImage.classList.remove('flip-out');
                bigWenImage.classList.add('flip-in');
                setTimeout(() => {
                    bigWenImage.classList.remove('flip-in');
                }, 600);
            }, 300);
        }
        if (bigWenPrevBtn) {
            bigWenPrevBtn.addEventListener('click', function () {
                bigWenCurrentIndex = (bigWenCurrentIndex - 1 + bigWenImages.length) % bigWenImages.length;
                flipBigWenPage(bigWenCurrentIndex);
            });
        }
        if (bigWenNextBtn) {
            bigWenNextBtn.addEventListener('click', function () {
                bigWenCurrentIndex = (bigWenCurrentIndex + 1) % bigWenImages.length;
                flipBigWenPage(bigWenCurrentIndex);
            });
        }
        const womensDiv = document.querySelector('.womens');
        const donateImg = document.querySelector('.wen_page .donate');
        if (womensDiv && donateImg) {
            womensDiv.style.cursor = 'pointer';
            womensDiv.addEventListener('click', function () {
                donateImg.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            });
        }
        const playButton = document.querySelector('.video_con .play');
        const video = document.querySelector('.video_con video');
        if (playButton && video) {
            playButton.addEventListener('click', function () {
                playButton.style.display = 'none';
                video.style.display = 'block';
                video.play();
            });
            video.addEventListener('pause', function () {
                playButton.style.display = 'block';
                video.style.display = 'none';
            });
            video.addEventListener('ended', function () {
                playButton.style.display = 'block';
                video.style.display = 'none';
            });
        }
        const donateImage = document.querySelector('.wen_page .donate');
        if (donateImage) {
            donateImage.style.cursor = 'pointer';
            donateImage.addEventListener('click', function () {
                showDonationModal();
            });
        }
        const staticProvider = new ethers.providers.StaticJsonRpcProvider(
            "https://bsc-dataseed.binance.org/",
            { name: "bnb", chainId: 56 }
        );
        function showDonationModal() {
            if (!TOKEN_CONTRACT) {
                showMsg('CA coming soon — follow @benbenbnb');
                return;
            }
            const modalOverlay = document.createElement('div');
            modalOverlay.id = 'donationModalOverlay';
            modalOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 10000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
                box-sizing: border-box;
            `;
            const modal = document.createElement('div');
            modal.style.cssText = `
                background: linear-gradient(135deg, #3a0a0a, #7a1a1a);
                border: 3px solid #f0b90b;
                border-radius: 12px;
                padding: 30px;
                max-width: 400px;
                width: 100%;
                box-shadow: 0px 8px 20px rgba(240, 185, 11, 0.35);
                position: relative;
            `;
            modal.innerHTML = `
                <div style="text-align: center; margin-bottom: 25px;">
                    <h2 style="margin: 0; color: #f0b90b; font-size: 24px; font-weight: bold;">Support 犇犇</h2>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: #ffffff; font-weight: bold;">Receiver:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="text" id="donationAddress" value="${DONATION_RECEIVER}" readonly 
                            style="flex: 1; padding: 12px; border: 2px solid #f0b90b; border-radius: 6px; background: #1a0808; font-size: 14px; color: #ffffff;">
                    </div>
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; color: #ffffff; font-weight: bold;">Amount (${TOKEN_TICKER}):</label>
                    <input type="number" id="donationAmount" placeholder="Enter amount" min="0" step="0.01"
                        style="width: 100%; padding: 12px; border: 2px solid #f0b90b; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: #1a0808; color: #ffffff;">
                </div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button id="confirmDonation" style="padding: 12px 30px; background: #f0b90b; color: #000000; border: 2px solid #000000; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;">Confirm</button>
                    <button id="cancelDonation" style="padding: 12px 30px; background: #555b77; color: #ffffff; border: 2px solid #000000; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;">Cancel</button>
                </div>
            `;
            modalOverlay.appendChild(modal);
            document.body.appendChild(modalOverlay);
            var isRun = false;
            document.getElementById('confirmDonation').addEventListener('click', async function () {
                if (isRun) return;
                isRun = true;
                const amount = document.getElementById('donationAmount').value;
                if (!amount || parseFloat(amount) <= 0) {
                    showMsg('Please enter a valid amount!');
                    isRun = false;
                    return;
                }
                if (!globalSigner) {
                    showMsg('Please connect wallet first.');
                    isRun = false;
                    return;
                }
                try {
                    const ERC20_ABI = [
                        "function balanceOf(address owner) view returns (uint256)",
                        "function transfer(address to, uint256 value) returns (bool)"
                    ];
                    const tokenContract = new ethers.Contract(TOKEN_CONTRACT, ERC20_ABI, globalSigner);
                    const myAddr = await globalSigner.getAddress();
                    const amountToSend = ethers.utils.parseUnits(amount.toString(), 18);
                    const bnbBalance = await staticProvider.getBalance(myAddr);
                    const minGas = ethers.utils.parseEther("0.001");
                    if (bnbBalance.lt(minGas)) {
                        showMsg("Your BNB balance is insufficient to cover the transaction fee.");
                        return;
                    }
                    const rawBalance = await tokenContract.balanceOf(myAddr);
                    if (rawBalance.lt(amountToSend)) {
                        showMsg("Your 犇犇 balance is insufficient.");
                        return;
                    }
                    const tx = await tokenContract.transfer(DONATION_RECEIVER, amountToSend);
                    if (tx && tx.hash) {
                        showMsg(`Thank you! Amount: ${amount} ${TOKEN_TICKER}`);
                    }
                    else {
                        showMsg('Transaction fail');
                    }
                    addDonate(tx.hash);
                    closeDonationModal();
                } catch (error) {
                    console.error('Donation failed:', error);
                    showMsg('Failed! Please try again.');
                } finally {
                    isRun = false;
                }
            });
            function closeDonationModal() {
                document.body.removeChild(modalOverlay);
            }
            document.getElementById('cancelDonation').addEventListener('click', function () {
                document.body.removeChild(modalOverlay);
            });
            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) {
                    document.body.removeChild(modalOverlay);
                }
            });
        }
        function copyCAToClipboard() {
            if (!TOKEN_CONTRACT) {
                showMsg('CA coming soon — follow @benbenbnb on X');
                return;
            }
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(TOKEN_CONTRACT).then(function () {
                    showMsg('CA address copied successfully');
                }).catch(function (err) {
                    console.error('Failed to copy CA address: ', err);
                    fallbackCopyTextToClipboard(TOKEN_CONTRACT);
                });
            } else {
                fallbackCopyTextToClipboard(TOKEN_CONTRACT);
            }
        }
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showMsg('Copy successful');
                } else {
                    showMsg('Copy failed');
                }
            } catch (err) {
                showMsg('Copy failed');
                console.error('Failed to copy CA address (fallback): ', err);
            }
            document.body.removeChild(textArea);
        }
        async function handleWalletConnect() {
            console.log('Connecting wallet...');
            if (globalSigner) return;
            const providerOptions = {
                walletconnect: {
                    package: window.WalletConnectProvider.default,
                    options: {
                        rpc: { 56: "https://bsc-dataseed.binance.org/" }
                    }
                }
            };
            const web3Modal = new window.Web3Modal.default({
                cacheProvider: false,
                providerOptions
            });
            try {
                const provider = await web3Modal.connect();
                const currentChainId = await provider.request({ method: 'eth_chainId' });
                if (currentChainId !== '0x38') {
                    try {
                        await provider.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x38' }]
                        });
                    } catch (switchErr) {
                        console.warn('change BSC fail', switchErr);
                        showMsg('Please switch to the BSC network first.');
                        return;
                    }
                }
                const ethersProvider = new ethers.providers.Web3Provider(provider);
                const signer = ethersProvider.getSigner();
                const walletAddress = await signer.getAddress();
                globalProvider = ethersProvider;
                globalSigner = signer;
                if (provider.removeAllListeners) {
                    provider.removeAllListeners('accountsChanged');
                    provider.removeAllListeners('chainChanged');
                }
                provider.on('accountsChanged', accounts => {
                    console.log('new account:', accounts);
                });
                provider.on('chainChanged', chainId => {
                    console.log('network change:', chainId);
                });
                const connectButton = document.querySelector('.CA .connect:not(.connect_ok)');
                const connectStatus = document.querySelector('.CA .connect_ok');
                if (connectButton && connectStatus) {
                    connectButton.style.display = 'none';
                    connectStatus.style.display = 'block';
                    const head = walletAddress.slice(0, 6);
                    const tail = walletAddress.slice(-4);
                    const result = head + '...' + tail;
                    connectStatus.innerHTML = result;
                }
                updateDonate(walletAddress);
                showMsg('Connection successful');
            } catch (error) {
                console.log('connect fail:', error);
                showMsg('Connection failed');
            }
        }
        async function updateTable() {
            // Placeholder rows until backend is ready
            const tbody = document.querySelector('.table-clone tbody');
            if (!tbody) return;
            if (tbody.children.length === 0) {
                tbody.innerHTML = `
                    <tr><td class="date">—</td><td class="add">Follow @benbenbnb</td><td class="num">犇犇</td></tr>
                    <tr><td class="date">—</td><td class="add">Built on BNB</td><td class="num">🔥</td></tr>
                    <tr><td class="date">—</td><td class="add">Born to Charge</td><td class="num">🐂</td></tr>
                `;
            }
        }
        updateTable();
        function showMsg(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.className = 'toast';
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease-out forwards';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 2000);
        }
        async function updateDonate(userAddress) {
            try {
                const url = new URL('/');
                url.searchParams.set('address', userAddress);
                const response = await fetch(url.toString(), {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) return;
                const data = await response.json();
                const donations = document.getElementById('donations');
                if (donations && data.total != null) donations.innerHTML = data.total;
            } catch (err) {
                console.error('Error fetching donations:', err);
            }
        }
        async function addDonate(txHash) {
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: new URLSearchParams({ tx_hash: txHash })
                });
                if (!response.ok) return;
                const data = await response.json();
                const donations = document.getElementById('donations');
                if (donations && data.total != null) donations.innerHTML = data.total;
            } catch (err) {
                console.error('Error fetching donations:', err);
            }
        }
    </script>
</body>
</html>
